aid: conservation-labs
name: Conservation Labs
description: Conservation Labs is a Pittsburgh-based smart water technology company, backed by
  Techstars, Amazon, RET Ventures and SustainVC. Its flagship product, H2know, is a clamp-on
  acoustic smart water monitor that measures a building's inbound pipe every second and uses
  patented sound-detection technology and machine learning to translate those signals into
  accurate water-flow estimates, leak alerts and water-usage insights delivered through a
  companion mobile and web app. The company also offers Sustainable Machines, an edge-to-cloud
  platform for machine condition monitoring and predictive maintenance. Conservation Labs
  serves residential homes, commercial real estate, restaurants and hotels, and industrial
  operators. As of this enrichment pass the company exposes a consumer-facing app but publishes
  no public developer API, OpenAPI specification, SDKs, or webhook documentation.
